[project]
name = "fabric-payments-medallion"
version = "0.1.0"
description = "Payments medallion lakehouse — Fabric-targeted, locally runnable"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Pinned to the Microsoft Fabric Spark runtime pairing (Spark 3.5 / Delta 3.2).
    # Version parity with the deployment target is deliberate — see docs/design-decisions.md.
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "faker==30.8.2",
    "sqlglot==25.32.1",
]

[project.optional-dependencies]
# pyodbc needs unixodbc + the MS ODBC driver, and is only required by the gold
# bridge step (which does not exist on Fabric at all). Kept out of the core install
# so the pipeline, the T-SQL linter and CI never depend on a database driver.
gold = [
    "pyodbc==5.2.0",
]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs; deselect with -m 'not slow'",
    "uses_isolated_lake: builds its own lake root rather than sharing the module's",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `src` is a genuine package here, not the src-layout convention. The reason is deployment parity:
# on Fabric this repo is installed into a Spark Environment as a library, so a notebook's
# `from src.runtime import params` resolves out of site-packages. An editable install reproduces
# exactly that, which is what lets a notebook be executed directly — the way the Fabric kernel
# executes it — rather than only via `python -m` from the repo root. Packages are listed explicitly
# because auto-discovery guesses, and a guess that differs between here and the Environment is the
# kind of drift this repo exists to avoid.
packages = [
    "src",
    "src.runtime",
    "src.lib",
    "src.notebooks",
    "orchestration",
]
